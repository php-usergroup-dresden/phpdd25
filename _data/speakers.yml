  - name: 'Christopher Hertel'
    bio: |
      Christopher Hertel is a seasoned PHP software engineer, Symfony expert, and active speaker in the international tech community. With a strong background in software architecture, agile development, and a deep curiosity for GenAI, he shares practical insights at conferences and meetups across Germany and Europe. As Head of Technical Program at AMCS Group, he drives innovation in enterprise software while contributing to open source and mentoring developer teams.
    image: 'https://avatars.githubusercontent.com/u/2852185?v=4'
    talk:
      title: 'Agentic Applications with Symfony'
      abstract: |
        Let's dive into the world of GenAI and have a look at the basic concepts, common use cases and hands-on examples of integrating LLMs and other AI models into our apps. We will discuss and discover features beyond chatbots or plain text generation, while working with your favorite programming language PHP.  By the end, you will be ready to bring agentic functionality into your own products and tools.
    social:
      - icon: 'linkedin'
        url: 'https://www.linkedin.com/in/christopher-hertel/'
    type: 'Talk/Workshop'

